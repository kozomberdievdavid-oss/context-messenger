<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTEXT</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1 class="logo">CONTEXT</h1>
      <p class="login-subtitle">Messenger · Latin usernames only</p>

      <div class="input-group">
        <span class="material-icons">person</span>
        <input id="username-input" type="text" placeholder="Username (a-z, 0-9, _)" pattern="[a-zA-Z0-9_]{3,20}" autocomplete="username" />
      </div>
      <div class="input-group">
        <span class="material-icons">email</span>
        <input id="email-input" type="email" placeholder="Email" autocomplete="email" />
      </div>
      <div class="input-group">
        <span class="material-icons">lock</span>
        <input id="password-input" type="password" placeholder="Password" autocomplete="current-password" />
      </div>

      <div class="auth-buttons">
        <button class="primary-btn" type="button" onclick="auth('login')">Sign in</button>
        <button class="secondary-btn" type="button" onclick="auth('register')">Register</button>
      </div>
      <p id="login-error"></p>
    </div>
  </div>

  <div id="chat-screen" class="screen" style="display: none">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>CONTEXT</h3>
      </div>

      <!-- Panel: Chats -->
      <div id="panel-chats" class="sidebar-panel active">
        <ul id="chats-list"></ul>
        <p class="panel-hint">No public user list. Find people in Search tab.</p>
      </div>

      <!-- Panel: Search -->
      <div id="panel-search" class="sidebar-panel">
        <div class="search-subtabs">
          <button type="button" class="active" data-mode="users" onclick="setSearchMode('users', this)">Users</button>
          <button type="button" data-mode="files" onclick="setSearchMode('files', this)">Files</button>
          <button type="button" data-mode="web" onclick="setSearchMode('web', this)">Web</button>
        </div>
        <div class="search-box">
          <span class="material-icons search-icon">search</span>
          <input id="search-input" type="search" placeholder="Find user (Latin)..." oninput="handleSearch()" />
          <button type="button" id="search-clear" class="search-clear" onclick="clearSearch()" style="display:none">
            <span class="material-icons">close</span>
          </button>
        </div>
        <ul id="search-list"></ul>
      </div>

      <!-- Panel: Profile -->
      <div id="panel-profile" class="sidebar-panel">
        <div class="profile-card">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <h4 id="profile-username">—</h4>
          <p id="profile-email" class="profile-email">—</p>
          <p id="profile-status" class="profile-status"></p>
        </div>
        <button type="button" class="profile-btn" onclick="logout()">
          <span class="material-icons">logout</span> Sign out
        </button>
        <div class="profile-admin">
          <p class="profile-admin-title">Reset database (admin)</p>
          <input id="admin-secret-input" type="password" placeholder="ADMIN_SECRET from Render" />
          <button type="button" class="danger-btn" onclick="wipeDatabase()">Delete all users &amp; messages</button>
          <p id="wipe-status" class="wipe-status"></p>
        </div>
      </div>

      <nav class="main-tabs">
        <button type="button" class="active" onclick="switchMainTab('chats', this)">
          <span class="material-icons">forum</span>
          <span>Chats</span>
        </button>
        <button type="button" onclick="switchMainTab('search', this)">
          <span class="material-icons">search</span>
          <span>Search</span>
        </button>
        <button type="button" onclick="switchMainTab('profile', this)">
          <span class="material-icons">person</span>
          <span>Profile</span>
        </button>
      </nav>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <button type="button" class="back-btn" onclick="closeChatMobile()">
          <span class="material-icons">arrow_back</span>
        </button>
        <div class="user-info">
          <div class="header-avatar-wrap">
            <span class="material-icons">account_circle</span>
            <span id="chat-header-online" class="online-dot"></span>
          </div>
          <div>
            <span id="current-chat-user">Select a chat</span>
            <span id="chat-header-status" class="chat-header-status"></span>
          </div>
        </div>
        <p id="typing-indicator" class="typing-indicator"></p>
      </header>

      <div id="messages-container" class="messages-empty-hint">
        <p class="empty-chat">Pick a chat or find a user in Search</p>
      </div>

      <div id="input-area" class="chat-input-area" style="display: none">
        <label class="attach-btn" title="Attach file">
          <span class="material-icons">attach_file</span>
          <input id="file-input" type="file" hidden onchange="uploadFile()" />
        </label>
        <input id="message-input" type="text" placeholder="Message..." autocomplete="off" onkeydown="if (event.key === 'Enter') sendMessage()" />
        <button class="send-btn" type="button" onclick="sendMessage()">
          <span class="material-icons">send</span>
        </button>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
