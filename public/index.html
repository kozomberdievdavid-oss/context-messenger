<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTEXT</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0f19" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Авторизация -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1 class="logo">CONTEXT</h1>
      <p class="login-subtitle">Мессенджер с поиском по файлам и вебу</p>

      <div class="input-group">
        <span class="material-icons">person</span>
        <input id="username-input" type="text" placeholder="Имя пользователя" autocomplete="username" />
      </div>
      <div class="input-group">
        <span class="material-icons">email</span>
        <input id="email-input" type="email" placeholder="Email" autocomplete="email" />
      </div>
      <div class="input-group">
        <span class="material-icons">lock</span>
        <input id="password-input" type="password" placeholder="Пароль" autocomplete="current-password" />
      </div>

      <div class="auth-buttons">
        <button class="primary-btn" type="button" onclick="auth('login')">Войти</button>
        <button class="secondary-btn" type="button" onclick="auth('register')">Регистрация</button>
      </div>
      <p id="login-error"></p>
    </div>
  </div>

  <!-- Чат -->
  <div id="chat-screen" class="screen" style="display: none">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>CONTEXT</h3>
        <button class="icon-btn" type="button" onclick="logout()" title="Выйти">
          <span class="material-icons">logout</span>
        </button>
      </div>

      <div class="search-tabs">
        <button type="button" class="active" data-mode="users" onclick="setMode('users', this)">
          <span class="material-icons">people</span>
          <span class="tab-label">Чаты</span>
        </button>
        <button type="button" data-mode="files" onclick="setMode('files', this)">
          <span class="material-icons">folder</span>
          <span class="tab-label">Файлы</span>
        </button>
        <button type="button" data-mode="web" onclick="setMode('web', this)">
          <span class="material-icons">public</span>
          <span class="tab-label">Веб</span>
        </button>
      </div>

      <div class="search-box">
        <span class="material-icons search-icon">search</span>
        <input
          id="search-input"
          type="search"
          placeholder="Поиск по имени..."
          oninput="handleSearch()"
        />
        <button type="button" id="search-clear" class="search-clear" onclick="clearSearch()" title="Очистить" style="display:none">
          <span class="material-icons">close</span>
        </button>
      </div>

      <ul id="sidebar-list"></ul>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <button type="button" class="back-btn" onclick="closeChatMobile()" title="Назад">
          <span class="material-icons">arrow_back</span>
        </button>
        <div class="user-info">
          <div class="header-avatar-wrap">
            <span class="material-icons">account_circle</span>
            <span id="chat-header-online" class="online-dot"></span>
          </div>
          <div>
            <span id="current-chat-user">Выберите чат</span>
            <span id="chat-header-status" class="chat-header-status"></span>
          </div>
        </div>
        <p id="typing-indicator" class="typing-indicator"></p>
      </header>

      <div id="messages-container" class="messages-empty-hint">
        <p class="empty-chat">Выберите собеседника слева, чтобы начать диалог</p>
      </div>

      <div id="input-area" class="chat-input-area" style="display: none">
        <label class="attach-btn" title="Прикрепить файл">
          <span class="material-icons">attach_file</span>
          <input id="file-input" type="file" hidden onchange="uploadFile()" />
        </label>
        <input
          id="message-input"
          type="text"
          placeholder="Сообщение..."
          autocomplete="off"
          onkeydown="if (event.key === 'Enter') sendMessage()"
        />
        <button class="send-btn" type="button" onclick="sendMessage()" title="Отправить">
          <span class="material-icons">send</span>
        </button>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
